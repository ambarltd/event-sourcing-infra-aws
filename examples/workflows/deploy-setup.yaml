name: Setup Terraform State Management
run-name: Validate State Management Configuration

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: TERRAFORM_STATE_SETUP
  cancel-in-progress: false

jobs:
  setup-terraform-state:
    runs-on: ubuntu-latest
    environment: State Management Configuration
    name: Setup Terraform State Management Infrastructure
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      FORCE_RECREATE: 'false'
      TERRAFORM_STATE_BUCKET: ${{ github.event.repository.name }}-state-bucket
      TERRAFORM_STATE_LOCK_TABLE: ${{ github.event.repository.name }}-state-table
    
    steps:
      - name: Validate Required Secrets
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "❌ AWS_REGION secret is not set"
            exit 1
          fi
          
          echo "✅ All required secrets are configured"
          echo "Region: $AWS_REGION"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check S3 Bucket Exists
        id: check-bucket
        run: |
          echo "Checking if S3 bucket exists..."
          
          if aws s3api head-bucket --bucket "$TERRAFORM_STATE_BUCKET" 2>/dev/null; then
            echo "✅ S3 bucket $TERRAFORM_STATE_BUCKET already exists"
            echo "bucket_exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ S3 bucket $TERRAFORM_STATE_BUCKET does not exist"
            echo "bucket_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create S3 Bucket for Terraform State
        if: steps.check-bucket.outputs.bucket_exists == 'false' || env.FORCE_RECREATE == 'true'
        run: |
          echo "Creating S3 bucket $TERRAFORM_STATE_BUCKET..."
          
          if [ "$FORCE_RECREATE" = "true" ] && [ "${{ steps.check-bucket.outputs.bucket_exists }}" = "true" ]; then
            echo "⚠️ Force recreate enabled - this will delete existing state!"
            echo "Skipping bucket deletion for safety. Please delete manually if needed."
          fi
          
          # Create the bucket with appropriate region
          if [ "$AWS_REGION" = "us-east-1" ]; then
            aws s3api create-bucket --bucket "$TERRAFORM_STATE_BUCKET"
          else
            aws s3api create-bucket \
              --bucket "$TERRAFORM_STATE_BUCKET" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi
          
          echo "✅ S3 bucket $TERRAFORM_STATE_BUCKET created successfully"

      - name: Configure S3 Bucket Settings
        if: steps.check-bucket.outputs.bucket_exists == 'false' || env.FORCE_RECREATE == 'true'
        run: |
          echo "Configuring S3 bucket settings..."
          
          # Enable versioning
          aws s3api put-bucket-versioning \
            --bucket "$TERRAFORM_STATE_BUCKET" \
            --versioning-configuration Status=Enabled
          
          # Enable default encryption
          aws s3api put-bucket-encryption \
            --bucket "$TERRAFORM_STATE_BUCKET" \
            --server-side-encryption-configuration '{
              "Rules": [
                {
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }
              ]
            }'
          
          # Block public access
          aws s3api put-public-access-block \
            --bucket "$TERRAFORM_STATE_BUCKET" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          
          # Enable access logging (optional - you may want to customize this)
          # aws s3api put-bucket-logging \
          #   --bucket "$TERRAFORM_STATE_BUCKET" \
          #   --bucket-logging-status file://logging.json
          
          echo "✅ S3 bucket security settings configured"

      - name: Check DynamoDB Table Exists
        id: check-table
        run: |
          echo "Checking if DynamoDB table $TERRAFORM_STATE_LOCK_TABLE exists..."
          
          if aws dynamodb describe-table --table-name "$TERRAFORM_STATE_LOCK_TABLE" 2>/dev/null; then
            echo "✅ DynamoDB table $TERRAFORM_STATE_LOCK_TABLE already exists"
            echo "table_exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ DynamoDB table $TERRAFORM_STATE_LOCK_TABLE does not exist"
            echo "table_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create DynamoDB Table for Terraform Locking
        if: steps.check-table.outputs.table_exists == 'false' || env.FORCE_RECREATE == 'true'
        run: |
          echo "Creating DynamoDB table $TERRAFORM_STATE_LOCK_TABLE..."
          
          if [ "$FORCE_RECREATE" = "true" ] && [ "${{ steps.check-table.outputs.table_exists }}" = "true" ]; then
            echo "⚠️ Force recreate enabled - deleting existing table..."
            aws dynamodb delete-table --table-name "$TERRAFORM_STATE_LOCK_TABLE"
            
            # Wait for table to be deleted
            echo "Waiting for table deletion to complete..."
            aws dynamodb wait table-not-exists --table-name "$TERRAFORM_STATE_LOCK_TABLE"
          fi
          
          # Create the DynamoDB table
          aws dynamodb create-table \
            --table-name "$TERRAFORM_STATE_LOCK_TABLE" \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST
          
          echo "Waiting for table to be created..."
          aws dynamodb wait table-exists --table-name "$TERRAFORM_STATE_LOCK_TABLE"
          
          echo "✅ DynamoDB table $TERRAFORM_STATE_LOCK_TABLE created successfully"

      - name: Enable DynamoDB Table Encryption
        if: steps.check-table.outputs.table_exists == 'false' || env.FORCE_RECREATE == 'true'
        run: |
          echo "Enabling encryption for DynamoDB table..."
          
          # Enable encryption at rest
          aws dynamodb update-table \
            --table-name "$TERRAFORM_STATE_LOCK_TABLE" \
            --sse-specification Enabled=true,SSEType=KMS || true
          
          echo "✅ DynamoDB table encryption configured"

      - name: Test Terraform State Infrastructure
        run: |
          echo "Testing Terraform state infrastructure..."
          
          # Test S3 bucket access
          echo "Testing S3 bucket access..."
          echo "test" > test-file.txt
          aws s3 cp test-file.txt s3://"$TERRAFORM_STATE_BUCKET"/test-file.txt
          aws s3 rm s3://"$TERRAFORM_STATE_BUCKET"/test-file.txt
          rm test-file.txt
          echo "✅ S3 bucket access test passed"
          
          # Test DynamoDB table access
          echo "Testing DynamoDB table access..."
          aws dynamodb put-item \
            --table-name "$TERRAFORM_STATE_LOCK_TABLE" \
            --item '{"LockID": {"S": "test-lock"}, "Info": {"S": "test-info"}}'
          
          aws dynamodb delete-item \
            --table-name "$TERRAFORM_STATE_LOCK_TABLE" \
            --key '{"LockID": {"S": "test-lock"}}'
          
          echo "✅ DynamoDB table access test passed"

      - name: Display Setup Summary
        run: |
          echo "## Terraform State Management Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: $AWS_REGION" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: $TERRAFORM_STATE_BUCKET" >> $GITHUB_STEP_SUMMARY
          echo "- **DynamoDB Table**: $TERRAFORM_STATE_LOCK_TABLE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-bucket.outputs.bucket_exists }}" = "true" ]; then
            echo "- **S3 Bucket**: ✅ Already existed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **S3 Bucket**: 🆕 Created new" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.check-table.outputs.table_exists }}" = "true" ]; then
            echo "- **DynamoDB Table**: ✅ Already existed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **DynamoDB Table**: 🆕 Created new" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "Your Terraform state management infrastructure is now ready!" >> $GITHUB_STEP_SUMMARY
          echo "You can now run the main infrastructure deployment workflow." >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Terraform Backend Configuration" >> $GITHUB_STEP_SUMMARY
          echo '```hcl' >> $GITHUB_STEP_SUMMARY
          echo 'terraform {' >> $GITHUB_STEP_SUMMARY
          echo '  backend "s3" {' >> $GITHUB_STEP_SUMMARY
          echo "    bucket         = \"$TERRAFORM_STATE_BUCKET\"" >> $GITHUB_STEP_SUMMARY
          echo '    key            = "path/to/your/terraform.tfstate"' >> $GITHUB_STEP_SUMMARY
          echo "    region         = \"$AWS_REGION\"" >> $GITHUB_STEP_SUMMARY
          echo "    dynamodb_table = \"$TERRAFORM_STATE_LOCK_TABLE\"" >> $GITHUB_STEP_SUMMARY
          echo '    encrypt        = true' >> $GITHUB_STEP_SUMMARY
          echo '  }' >> $GITHUB_STEP_SUMMARY
          echo '}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

    outputs:
      bucket_exists: ${{ steps.check-bucket.outputs.bucket_exists }}
      table_exists: ${{ steps.check-table.outputs.table_exists }}
      bucket_name: ${{ env.TERRAFORM_STATE_BUCKET }}
      table_name: ${{ env.TERRAFORM_STATE_LOCK_TABLE }}
      aws_region: ${{ secrets.AWS_REGION }}