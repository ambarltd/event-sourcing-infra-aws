name: "Backend Image: "

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  checks: write

run-name: ${{ github.workflow }} ${{ github.sha }}

jobs:
  push-backend-image-staging:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: <region-you-want>
          role-to-assume: arn:aws:iam::<aws-account-id>:role/<get-from-infra-outputs>
          role-session-name: BACKEND_IMAGE_PUSH

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag and push docker image to Amazon ECR
        working-directory: ./
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: <get-from-infra-outputs>
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DOCKER_BUILDKIT=1 docker build --progress=plain --tag $REGISTRY/$REPOSITORY:$IMAGE_TAG --file Dockerfile .
                    docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG